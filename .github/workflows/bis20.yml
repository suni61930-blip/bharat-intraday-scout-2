name: Bharat Intraday Scout 2.0

on:
  schedule:
    # Weekly NSE equity universe/liquidity refresh: Sunday 08:30 IST = 03:00 UTC.
    - cron: '0 3 * * 0'
    # Market scans: 09:20-09:25 IST, 09:30-15:25 IST, and 15:30 IST.
    - cron: '50,55 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose a manual task'
        required: true
        type: choice
        default: test-telegram
        options:
          - test-telegram
          - test-kronos
          - refresh-universe
          - scan

# Do not allow two runs to mutate the same SQLite state at once.
concurrency:
  group: bis20-main-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scanner:
    # Manual setup/test runs always work; timed schedules stay disabled until
    # the owner explicitly sets the repository variable BIS_SCANNER_ENABLED=true.
    if: github.event_name != 'schedule' || vars.BIS_SCANNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRICE_FLOOR: '60'
      MIN_AVG_TURNOVER_INR: '100000000'
      INTRADAY_UNIVERSE_SIZE: '100'
      MAX_SIGNALS_PER_DAY: '3'
      KRONOS_ENABLED: 'true'
      KRONOS_REQUIRED: 'true'
    steps:
      - name: Checkout private scanner repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select task
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "0 3 * * 0" ]]; then
            echo "name=refresh-universe" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "name=${MANUAL_TASK:-test-telegram}" >> "$GITHUB_OUTPUT"
          else
            echo "name=scan" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected task: $(tail -n 1 "$GITHUB_OUTPUT")"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Python environment cache
        id: python-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: bis20-venv-ubuntu-py311-v1-${{ hashFiles('requirements.txt') }}

      - name: Install CPU-only PyTorch and scanner requirements
        if: steps.python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1+cpu'
          .venv/bin/python -m pip install -r requirements.txt

      - name: Restore Kronos model cache
        if: steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos'
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: bis20-hf-kronos-mini-tokenizer2k-v1

      - name: Clone official Kronos source
        if: steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos'
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos

      - name: Run Bharat Intraday Scout
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
        run: .venv/bin/python scanner.py --task "$TASK_NAME"

      - name: Commit scanner state and universe cache
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/bis20.sqlite3 data/liquid_universe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "BIS 2.0: persist scanner state"
            git push origin HEAD:main
          else
            echo "No state/cache changes to commit."
          fi
