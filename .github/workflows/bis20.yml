name: Bharat Intraday Scout 2.0

on:
  schedule:
    # Weekly universe refresh: Sunday 08:17 IST (= 02:47 UTC). Off-peak minute on purpose.
    - cron: '47 2 * * 0'
    # Market scans, every 10 minutes, 09:47-14:37 IST (= 04:17-09:07 UTC), weekdays.
    # Odd minutes (not :00/:05) because GitHub drops/delays cron jobs at busy marks.
    - cron: '17,27,37,47,57 4 * * 1-5'
    - cron: '7,17,27,37,47,57 5-8 * * 1-5'
    - cron: '7 9 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Manual task (an external scheduler should send: scan)'
        required: true
        type: choice
        default: scan
        options:
          - scan
          - test-telegram
          - refresh-universe
          - dry-run-v2
          - test-kronos

concurrency:
  group: bis20-main-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scanner:
    # Timed schedules only run when repo variable BIS_SCANNER_ENABLED=true.
    if: github.event_name != 'schedule' || vars.BIS_SCANNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # ---- strategy knobs ----
      MOVER_MIN_PCT: '10'          # stock must be >= 10% from previous close
      MOVER_RELAXED_PCT: '7'       # used after 11:30 IST only if no alert sent yet today
      MAX_SIGNALS_PER_DAY: '2'
      MIN_SCORE: '60'
      INTRADAY_UNIVERSE_SIZE: '600'
      MIN_AVG_TURNOVER_INR: '50000000'
      PRICE_FLOOR: '50'
      # Kronos is OFF by default: it needs a ~1 GB PyTorch install and was gating every alert.
      KRONOS_ENABLED: 'false'
      KRONOS_REQUIRED: 'false'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Select task
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "47 2 * * 0" ]]; then
            echo "name=refresh-universe" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "name=${MANUAL_TASK:-scan}" >> "$GITHUB_OUTPUT"
          else
            echo "name=scan" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected: $(tail -n 1 "$GITHUB_OUTPUT")  (event=$EVENT_NAME cron=$SCHEDULE_CRON)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install lightweight requirements
        run: python -m pip install -r requirements.txt

      - name: Kronos (only when enabled)
        if: env.KRONOS_ENABLED == 'true' && (steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos')
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1+cpu'
          python -m pip install -r requirements-kronos.txt
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos

      - name: Run scanner
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
        run: python scanner.py --task "$TASK_NAME"

      - name: Upload dry-run report
        if: always() && steps.task.outputs.name == 'dry-run-v2'
        uses: actions/upload-artifact@v4
        with:
          name: bis20-dry-run-report
          path: dry_run_v2_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit scanner state
        if: success() && steps.task.outputs.name != 'dry-run-v2'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/bis20.sqlite3 data/liquid_universe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "BIS: persist scanner state"
            git push origin HEAD:main || { git pull --rebase -X theirs origin main && git push origin HEAD:main; }
          else
            echo "No state changes."
          fi

      # If anything above breaks, you get a Telegram message instead of silence.
      - name: Telegram failure alert
        if: failure() && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          curl -s -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Bharat Scout run FAILED (${{ steps.task.outputs.name }}). Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
