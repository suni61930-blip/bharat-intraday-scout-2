name: Bharat Intraday Scout 2.0

on:
  schedule:
    # Weekly NSE equity universe/liquidity refresh: Sunday 08:30 IST = 03:00 UTC.
    - cron: '0 3 * * 0'
    # Staggered weekday session launchers (08:45, 09:05, 09:20 IST and every 30m from 09:30 to 14:30 IST).
    - cron: '15,35,50 3 * * 1-5'
    - cron: '0,30 4-8 * * 1-5'
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose a manual task'
        required: true
        type: choice
        default: scan
        options:
          - scan
          - reset-today-quota
          - dry-run-v2
          - refresh-universe
          - test-telegram
          - test-kronos

# Prevent two runs from mutating SQLite state or running duplicate loops simultaneously.
concurrency:
  group: bis20-main-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-scanner:
    if: github.event_name != 'schedule' || vars.BIS_SCANNER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRICE_FLOOR: '50'
      MIN_AVG_TURNOVER_INR: '50000000'
      INTRADAY_UNIVERSE_SIZE: '200'
      MAX_SIGNALS_PER_DAY: '4'
      MAX_SIGNALS_PER_CYCLE: '1'
      CONTINUOUS_LOOP_MINUTES: '50'
      KRONOS_ENABLED: 'true'
      KRONOS_REQUIRED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Select task and check market hours
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "0 3 * * 0" ]]; then
            TASK="refresh-universe"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TASK="${MANUAL_TASK:-scan}"
          else
            TASK="scan"
          fi
          echo "name=$TASK" >> "$GITHUB_OUTPUT"

          IST_HM=$(TZ="Asia/Kolkata" date +%H%M)
          IST_DOW=$(TZ="Asia/Kolkata" date +%u)
          if [[ "$EVENT_NAME" == "schedule" && "$TASK" == "scan" ]]; then
            if (( IST_DOW > 5 || 10#$IST_HM < 830 || 10#$IST_HM > 1445 )); then
              echo "skip_outside_hours=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run triggered at IST $IST_HM (outside 08:30-14:45 IST); skipping cleanly."
              exit 0
            fi
          fi
          echo "skip_outside_hours=false" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK (IST $IST_HM)"

      - name: Set up Python 3.11
        if: steps.task.outputs.skip_outside_hours != 'true'
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Restore Python environment cache
        if: steps.task.outputs.skip_outside_hours != 'true'
        id: python-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .venv
          key: bis20-venv-ubuntu-${{ steps.setup-python.outputs.python-version }}-v3-${{ hashFiles('requirements.txt') }}

      - name: Ensure healthy Python virtual environment
        if: steps.task.outputs.skip_outside_hours != 'true'
        shell: bash
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -c "import numpy, pandas, yfinance, requests, torch" >/dev/null 2>&1; then
            echo "Building fresh .venv for Python ${{ steps.setup-python.outputs.python-version }}..."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1+cpu'
            .venv/bin/python -m pip install -r requirements.txt
          else
            echo "Cached .venv verified healthy for Python ${{ steps.setup-python.outputs.python-version }}."
          fi

      - name: Restore Kronos model cache
        if: steps.task.outputs.skip_outside_hours != 'true' && (steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos' || steps.task.outputs.name == 'dry-run-v2')
        id: hf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: bis20-hf-kronos-mini-tokenizer2k-v1

      - name: Clone official Kronos source
        if: steps.task.outputs.skip_outside_hours != 'true' && (steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos' || steps.task.outputs.name == 'dry-run-v2')
        run: |
          rm -rf vendor/Kronos
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos || echo "Warning: Kronos clone failed; running technical strategy."

      - name: Run Bharat Intraday Scout (Auto-Looping Session)
        if: steps.task.outputs.skip_outside_hours != 'true'
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
        run: .venv/bin/python scanner.py --task "$TASK_NAME"

      - name: Upload dry-run V2 diagnostic report
        if: always() && steps.task.outputs.name == 'dry-run-v2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bis20-dry-run-v2-report
          path: dry_run_v2_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit scanner state and universe cache
        if: always() && steps.task.outputs.skip_outside_hours != 'true' && steps.task.outputs.name != 'dry-run-v2'
        shell: bash
        run: |
          cp runtime/bis20.sqlite3 /tmp/bis20.sqlite3.bak 2>/dev/null || true
          cp data/liquid_universe.json /tmp/liquid_universe.json.bak 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git reset --hard origin/main || true
          cp /tmp/bis20.sqlite3.bak runtime/bis20.sqlite3 2>/dev/null || true
          cp /tmp/liquid_universe.json.bak data/liquid_universe.json 2>/dev/null || true
          git add runtime/bis20.sqlite3 data/liquid_universe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "BIS 2.0: persist scanner state [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "No state/cache changes to commit."
          fi

      - name: Auto-chain next 50-minute scan session if market still open
        if: success() && steps.task.outputs.skip_outside_hours != 'true' && steps.task.outputs.name == 'scan'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IST_HM=$(TZ="Asia/Kolkata" date +%H%M)
          IST_DOW=$(TZ="Asia/Kolkata" date +%u)
          TODAY_SIGNALS=$(.venv/bin/python -c "import scanner; print(scanner.get_today_signal_count())" 2>/dev/null || echo "0")
          MAX_DAILY="${MAX_SIGNALS_PER_DAY:-4}"
          echo "Current IST: $IST_HM | Signals today: $TODAY_SIGNALS / $MAX_DAILY"
          if (( IST_DOW <= 5 && 10#$IST_HM >= 915 && 10#$IST_HM < 1440 && TODAY_SIGNALS < MAX_DAILY )); then
            echo "Market still open and signals ($TODAY_SIGNALS/$MAX_DAILY) below daily cap. Auto-dispatching next 50-minute scan session..."
            gh workflow run bis20.yml --ref main -f task=scan || true
          else
            echo "No further auto-chain needed (either market past 14:40 IST or daily signal cap reached)."
          fi

